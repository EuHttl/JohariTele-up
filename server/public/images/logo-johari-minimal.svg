<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Johari Window Grid - representing the 4 quadrants -->
  <!-- Quadrant 1: Open Area (top-left) -->
  <rect x="8" y="8" width="20" height="20" rx="2" fill="url(#logoGradient)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="18" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">1</text>
  
  <!-- Quadrant 2: Blind Spot (top-right) -->
  <rect x="36" y="8" width="20" height="20" rx="2" fill="rgba(167,139,250,0.8)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="46" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">2</text>
  
  <!-- Quadrant 3: Hidden Area (bottom-left) -->
  <rect x="8" y="36" width="20" height="20" rx="2" fill="rgba(147,51,234,0.8)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="18" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">3</text>
  
  <!-- Quadrant 4: Unknown Area (bottom-right) -->
  <rect x="36" y="36" width="20" height="20" rx="2" fill="rgba(139,92,246,0.8)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="46" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">4</text>
  
  <!-- Central intersection lines -->
  <line x1="28" y1="8" x2="28" y2="56" stroke="rgba(124,58,237,0.6)" stroke-width="1"/>
  <line x1="8" y1="28" x2="56" y2="28" stroke="rgba(124,58,237,0.6)" stroke-width="1"/>
  
  <!-- Decorative elements -->
  <circle cx="32" cy="32" r="2" fill="url(#accentGradient)"/>
</svg>
